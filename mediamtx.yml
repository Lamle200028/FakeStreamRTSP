# MediaMTX Configuration - Optimized for Low Latency & High FPS
paths:
  live:
    # Ep camera nhan dinh dang MJPEG 30fps de khong bi roi vao che do 5fps YUYV
    runOnInit: ffmpeg -f dshow -vcodec mjpeg -framerate 30 -video_size 1920x1080 -rtbufsize 100M -i video="XWF 1080P  PC Camera" -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 30 -b:v 3000k -maxrate 3500k -bufsize 6000k -f rtsp rtsp://127.0.0.1:8554/live
    runOnInitRestart: yes
